<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08060f">
<title>Umbral</title>
<style>
/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
:root, html[data-skin="cyber"] {
	--bg:#08060f; --card:#12101f; --text:#f2f0ff; --muted:#9a94c4; --line:#3a2f6b;
	--cyan:#00f0ff; --pink:#ff2a6d; --lime:#05ffa1; --sun:#fcee0a; --violet:#b967ff; --red:#ff2a6d;
	--onacc:#04101a; --sweep:rgba(0,240,255,.14);
	--ff:"Courier New",ui-monospace,monospace; --fh:"Courier New",ui-monospace,monospace;
	--r:0px; --clip:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
	--btnr:0; --btnclip:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); --btnshadow:none;
	--avr:0; --avclip:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); --avborder:0;
	--barr:0; --barclip:none; --border:1.5px solid var(--line); --tshadow:inset 0 0 30px color-mix(in srgb,var(--cyan) 7%,transparent);
	--navborder:2px solid var(--cyan); --navshadow:0 -4px 24px color-mix(in srgb,var(--cyan) 25%,transparent); --heroborder:var(--cyan);
	--bootbg:#000; --bootfg:var(--lime); --lvbg:radial-gradient(circle,rgba(138,91,255,.5),rgba(4,2,20,.92)); --lvfg:#fff;
	--enter:glitchin;
	--sky:radial-gradient(circle at 85% 12%,rgba(255,42,109,.3),transparent 45%),radial-gradient(circle at 10% 75%,rgba(0,240,255,.2),transparent 50%),#08060f;
}
html[data-skin="space"] {
	--bg:#050b1f; --card:#0c1736; --text:#e9f2ff; --muted:#8fa6d6; --line:#24407a;
	--cyan:#4dd8ff; --pink:#ff7ad9; --lime:#7dffb2; --sun:#ffd86b; --violet:#8f7bff; --red:#ff6b81; --onacc:#03112b; --sweep:rgba(77,216,255,.13);
	--ff:"Trebuchet MS","Segoe UI",system-ui,sans-serif; --fh:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
	--r:0px; --clip:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,0 100%);
	--btnr:0; --btnclip:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%); --btnshadow:none;
	--avr:50%; --avclip:none; --avborder:2px solid var(--cyan); --barr:0; --barclip:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%);
	--border:1.5px solid var(--line); --tshadow:inset 0 0 30px rgba(77,216,255,.07);
	--navborder:2px solid var(--cyan); --navshadow:0 -4px 24px rgba(77,216,255,.28); --heroborder:var(--cyan);
	--bootbg:#020816; --bootfg:var(--cyan); --lvbg:radial-gradient(circle,rgba(60,100,255,.5),rgba(2,8,22,.94)); --lvfg:#fff; --enter:zoomin;
	--sky:radial-gradient(circle at 80% 10%,rgba(143,123,255,.38),transparent 50%),radial-gradient(circle at 10% 70%,rgba(77,216,255,.18),transparent 50%),#050b1f;
}
html[data-skin="magic"] {
	--bg:#150a2e; --card:#241242; --text:#fdf3ff; --muted:#c3a8e8; --line:#6b3fa0;
	--cyan:#c79bff; --pink:#ff7ad1; --lime:#8bff9f; --sun:#ffd166; --violet:#9d6bff; --red:#ff6b6b; --onacc:#1a0b3a; --sweep:rgba(255,209,102,.16);
	--ff:Georgia,"Palatino Linotype",serif; --fh:Georgia,"Palatino Linotype",serif;
	--r:1.6rem; --clip:none; --btnr:999px; --btnclip:none; --btnshadow:0 0 10px rgba(255,209,102,.25);
	--avr:50%; --avclip:none; --avborder:3px double var(--sun); --barr:999px; --barclip:none;
	--border:3px double var(--sun); --tshadow:0 0 22px rgba(255,209,102,.22),inset 0 0 30px rgba(157,107,255,.2);
	--navborder:3px double var(--sun); --navshadow:0 -4px 24px rgba(255,209,102,.25); --heroborder:var(--sun);
	--bootbg:radial-gradient(circle at 50% 40%,#3a1a6e,#0d0620); --bootfg:var(--sun); --lvbg:radial-gradient(circle,rgba(255,209,102,.4),rgba(13,6,32,.94)); --lvfg:#fff; --enter:poof;
	--sky:radial-gradient(circle at 50% 0%,rgba(157,107,255,.5),transparent 55%),radial-gradient(circle at 90% 90%,rgba(255,122,209,.25),transparent 50%),#150a2e;
}
html[data-skin="dojo"] {
	--bg:#efe4cc; --card:#faf3e3; --text:#1d1a16; --muted:#6b5f4c; --line:#bfae8a;
	--cyan:#1f3a5f; --pink:#c1272d; --lime:#3f7a35; --sun:#b8860b; --violet:#7a2e2e; --red:#c1272d; --onacc:#faf3e3; --sweep:rgba(193,39,45,.1);
	--ff:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",Georgia,serif; --fh:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",Georgia,serif;
	--r:4px; --clip:none; --btnr:4px; --btnclip:none; --btnshadow:3px 3px 0 #1d1a16;
	--avr:12px; --avclip:none; --avborder:3px solid var(--red); --barr:2px; --barclip:none;
	--border:2px solid #1d1a16; --tshadow:4px 4px 0 rgba(0,0,0,.28); --cardmix:100%; --blur:none;
	--navborder:4px solid var(--red); --navshadow:0 -3px 0 rgba(0,0,0,.15); --heroborder:#1d1a16;
	--bootbg:#efe4cc; --bootfg:#1d1a16; --lvbg:radial-gradient(circle,rgba(250,243,227,.96),rgba(214,196,160,.97)); --lvfg:#1d1a16; --enter:unroll;
	--sky:radial-gradient(circle at 50% 30%,rgba(255,255,255,.55),transparent 60%),#efe4cc;
}
html[data-skin="dojo"] .tile, html[data-skin="dojo"] .card { border-left:10px solid var(--red); }
html[data-skin="dojo"] .bar > i { box-shadow:none; background:repeating-linear-gradient(90deg,var(--red) 0 10px,#8f1c21 10px 12px); animation:none; }
html[data-skin="dojo"] button.big { background:linear-gradient(110deg,#c1272d,#8f1c21); }
html[data-skin="magic"] #title { color:transparent; background:linear-gradient(90deg,#ffd166,#fff,#ffd166); background-size:250% 100%; -webkit-background-clip:text; background-clip:text; animation:shine 3s linear infinite; }
html[data-skin="cyber"] #title { animation:glitch 5s infinite; }
@keyframes glitch { 0%,92%,100% { text-shadow:2px 0 var(--pink),-2px 0 var(--cyan); } 94% { text-shadow:-4px 0 var(--pink),4px 0 var(--cyan); transform:translateX(2px); } 96% { transform:translateX(-2px); } }
@keyframes glitchin { 0% { opacity:0; transform:translateX(-40px) skewX(-20deg); filter:hue-rotate(90deg) blur(3px); } 60% { opacity:1; transform:translateX(8px) skewX(6deg); } }
@keyframes zoomin { 0% { opacity:0; transform:scale(.3) translateY(60px); filter:blur(6px) brightness(2); } }
@keyframes poof { 0% { opacity:0; transform:scale(.1) rotate(-30deg); filter:blur(10px) brightness(2.5); } 70% { transform:scale(1.08) rotate(3deg); } }
@keyframes unroll { 0% { opacity:0; transform:scaleY(.05) translateY(-20px); transform-origin:top; } }

:root { padding-top:env(safe-area-inset-top,0px); }
html { scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--text); font-family:var(--ff); font-size:1.05rem; line-height:1.3; -webkit-tap-highlight-color:transparent; touch-action:manipulation; overflow-x:hidden; }
main { max-width:620px; margin:0 auto; padding:14px 14px calc(110px + env(safe-area-inset-bottom,0px)); }
h2, #title, .digits, .acount, h1, .lvl, .hud { font-family:var(--fh); }
h2 { margin:0 0 8px; font-size:.74rem; color:var(--cyan); text-transform:uppercase; letter-spacing:.14em; }
small, .muted { color:var(--muted); }
label { display:block; margin:8px 0 4px; color:var(--muted); font-size:.85rem; }

/* ===== Estructura ===== */
#sky { position:fixed; inset:0; z-index:-1; overflow:hidden; background:var(--sky); }
#stars, #fx { position:absolute; inset:0; }
#fx { position:fixed; z-index:145; pointer-events:none; }
.bento { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
.span2 { grid-column:span 2; }
.pacts, .plist { display:contents; }
.plist .card { grid-column:span 2; }
.tile, .card { position:relative; overflow:hidden; padding:14px; margin:0; border-radius:var(--r); clip-path:var(--clip); border:var(--border);
	background-color:color-mix(in srgb,var(--card) var(--cardmix,86%),transparent); backdrop-filter:var(--blur,blur(6px)); box-shadow:var(--tshadow); }
.card { margin-bottom:12px; }
.tile::after { content:""; position:absolute; inset:0; pointer-events:none; transform:translateX(-130%); animation:sweep 7s infinite; background:linear-gradient(105deg,transparent 42%,var(--sweep) 50%,transparent 58%); }
.tile:nth-child(2n)::after { animation-delay:2s; } .tile:nth-child(3n)::after { animation-delay:4s; }
.tab { display:none; } .tab.on { display:block; }
.tab.enter .tile { animation:var(--enter) .7s cubic-bezier(.2,.9,.3,1.2) both; animation-delay:calc(var(--i,0) * 70ms); }
.hud { grid-column:span 2; display:flex; justify-content:space-between; gap:6px; font-size:.58rem; letter-spacing:.1em; color:var(--lime); }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--lime); box-shadow:0 0 8px var(--lime); animation:blink 1.2s infinite; }
nav { position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex; gap:4px; padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px)); background:var(--card); border-top:var(--navborder); box-shadow:var(--navshadow); }
nav button { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; border:0; background:transparent; box-shadow:none; clip-path:none !important; border-radius:calc(var(--r) / 2); padding:8px 0; font-size:1.5rem; line-height:1; color:var(--muted); min-height:56px; }
nav button small { font-size:.7rem; font-weight:700; color:inherit; }
nav button.on { background:color-mix(in srgb,var(--cyan) 20%,transparent); color:var(--cyan); box-shadow:inset 0 -3px 0 var(--cyan); }

/* ===== Componentes ===== */
button, select, input[type=text], input[type=password], input[type=number], textarea { font:inherit; color:var(--text); border:1.5px solid var(--line); background:color-mix(in srgb,var(--card) 70%,transparent); padding:10px 16px; border-radius:var(--btnr); clip-path:var(--btnclip); box-shadow:var(--btnshadow,none); }
button, select, input { min-height:44px; }
input[type=text], input[type=password], input[type=number], select { width:100%; padding:12px 16px; }
input:focus, select:focus, textarea:focus { outline:none; border-color:var(--cyan); }
button { cursor:pointer; font-weight:700; transition:transform .12s,border-color .2s; }
button:hover { border-color:var(--cyan); } button:active { transform:scale(.94); }
button.big { width:100%; padding:14px; border:0; color:#fff; font-weight:800; text-shadow:0 1px 3px rgba(0,0,0,.5); background:linear-gradient(110deg,var(--pink),var(--violet),var(--cyan),var(--pink)); background-size:250% 100%; animation:shine 3s linear infinite,bounce 2.2s infinite; }
.btns { display:flex; gap:8px; } .btns button { flex:1; }
.opts { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 12px; }
.opt.on, .skins button.on { background:var(--cyan); color:var(--onacc); border-color:var(--cyan); }
.sechead { display:flex; justify-content:space-between; align-items:center; }
.bar { height:14px; margin:6px 0 3px; overflow:hidden; border:1.5px solid var(--line); background:color-mix(in srgb,var(--line) 80%,transparent); border-radius:var(--barr); clip-path:var(--barclip); }
.bar > i { display:block; height:100%; width:0; border-radius:var(--barr); transition:width .8s cubic-bezier(.2,.9,.3,1.3); background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink),var(--cyan)); background-size:200% 100%; animation:shine 2.5s linear infinite; box-shadow:0 0 12px var(--cyan); }
.hero { display:flex; align-items:center; gap:12px; border-color:var(--heroborder,var(--cyan)); }
.avatar { flex:none; width:66px; height:66px; display:grid; place-items:center; font-size:2.6rem; overflow:hidden; cursor:pointer; border-radius:var(--avr); clip-path:var(--avclip); border:var(--avborder,0); background:radial-gradient(circle,color-mix(in srgb,var(--violet) 55%,transparent),color-mix(in srgb,var(--cyan) 25%,transparent)); animation:float 3s ease-in-out infinite; }
.avatar img { width:100%; height:100%; object-fit:cover; }
.avatar.hit { animation:hit .6s; }
.grow { flex:1; min-width:0; }
.nm { cursor:pointer; display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
#title { font-size:.85rem; }
.lvl { background:var(--pink); color:#fff; padding:2px 10px; font-size:.65rem; border-radius:var(--btnr); }
.more { color:var(--cyan); }
.side { display:flex; flex-direction:column; align-items:center; gap:6px; }
.vol { padding:4px 12px; font-size:1rem; }
.streak { text-align:center; border:1.5px solid #ff8a1f; border-radius:1rem; padding:6px 10px; font-size:1.4rem; font-weight:800; color:#ff8a1f; animation:flame 1.4s ease-in-out infinite; }
.streak small { display:block; font-size:.6rem; color:var(--muted); }
#count { text-align:center; } #count .lbl { font-size:.6rem; letter-spacing:.12em; color:var(--muted); }
.digits { font-size:1.5rem; font-weight:800; color:var(--cyan); font-variant-numeric:tabular-nums; margin-top:4px; }
.tick { display:inline-block; animation:tick .4s; color:var(--pink); }
.chips { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.st { cursor:pointer; clip-path:none; box-shadow:none; text-align:center; border:1px solid var(--line); border-radius:calc(var(--r) / 2); padding:6px 2px; background:color-mix(in srgb,var(--card) 60%,transparent); }
.st b { display:block; color:var(--lime); } .st small { font-size:.7rem; }
.goldnum { font-size:1.8rem; color:var(--sun); }
.mrow { display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--line); }
.pact { display:flex; flex-direction:column; gap:4px; text-align:center; transition:transform .15s; border:1.5px dashed color-mix(in srgb,var(--c,#19f0ff) 60%,var(--line)); background-color:color-mix(in srgb,var(--c,#19f0ff) 10%,var(--card)); }
.pact b { font-size:1.12rem; } .pact small { font-size:.62rem; letter-spacing:.14em; }
.rws { display:flex; flex-wrap:wrap; justify-content:center; gap:4px; }
.rw { font-size:.72rem; padding:2px 8px; border-radius:999px; background:color-mix(in srgb,var(--lime) 18%,transparent); color:var(--lime); border:1px solid color-mix(in srgb,var(--lime) 50%,transparent); }
.pact .arrow { color:var(--c); animation:nudge 1.2s infinite; }
.pact .badge { position:absolute; top:8px; right:12px; font-size:1.3rem; z-index:1; }
.pact button { margin-top:6px; position:relative; z-index:1; }
.pact .alt { font-size:.9rem; background:transparent; border-color:transparent; box-shadow:none; color:var(--muted); padding:4px; }
.locked .reward { opacity:.5; filter:grayscale(1) blur(.4px); }
.pact.ready { border:2px solid var(--sun); background-color:color-mix(in srgb,var(--sun) 16%,var(--card)); animation:readyglow 1.2s infinite; }
.pact.claimed { border:2px solid var(--lime); background-color:color-mix(in srgb,var(--lime) 14%,var(--card)); }
.pact.claimed .badge { animation:stamp .5s cubic-bezier(.2,1.8,.4,1); }
.pact.just, .task.just { animation:pop .7s cubic-bezier(.2,1.6,.4,1); }
.task { display:flex; align-items:center; gap:10px; padding:10px 12px; border-left:5px solid var(--u); }
.task.u0 { --u:var(--red); } .task.u1 { --u:#ff8a1f; } .task.u2 { --u:var(--sun); } .task.u3 { --u:var(--lime); }
.task.done { opacity:.5; } .task.done b { text-decoration:line-through; }
.chk { flex:none; width:38px; height:38px; padding:0; border-radius:50%; clip-path:none; border:2px solid var(--u); font-size:1.2rem; color:var(--lime); }
.task.done .chk { background:var(--lime); color:#000; }
#reveal { position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(4,2,20,.82); }
.rbox { text-align:center; perspective:1000px; } .rbox .big { margin-top:16px; }
.lootcard { position:relative; width:min(300px,78vw); height:min(390px,58dvh); margin:0 auto; transform-style:preserve-3d; transform:rotateY(0deg) scale(.6); transition:transform 1s cubic-bezier(.3,1.4,.5,1); }
.lootcard.is-flipped { transform:rotateY(180deg) scale(1); }
.face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; border:2px solid var(--sun); background:var(--card); color:var(--text); border-radius:var(--r); clip-path:var(--clip); }
.face.back { font-size:5rem; background:repeating-linear-gradient(45deg,var(--card) 0 10px,color-mix(in srgb,var(--cyan) 22%,var(--card)) 10px 20px); }
.face.front { transform:rotateY(180deg); }
.lootcard.legend .front { border-width:4px; box-shadow:inset 0 0 30px color-mix(in srgb,var(--sun) 55%,transparent); }
.lootcard .em { font-size:4rem; animation:float 1.6s ease-in-out infinite; }
.rwrow { display:flex; justify-content:space-between; gap:14px; margin:4px 0; font-size:1.1rem; } .rwrow b { color:var(--lime); }
.lootname { font-size:1.3rem; color:var(--sun); }
.conf { position:fixed; top:50%; left:50%; z-index:95; pointer-events:none; animation:burst 1.4s ease-out forwards; }
.flycard { position:fixed; z-index:146; width:56px; height:76px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:1.6rem; pointer-events:none; border:2px solid var(--sun); background:var(--card); color:var(--lime); border-radius:calc(var(--r) / 2 + 4px); box-shadow:0 0 18px var(--sun); }
.flycard b { font-size:.8rem; }
.ripple { position:fixed; z-index:210; width:12px; height:12px; margin:-6px; border-radius:50%; pointer-events:none; border:2px solid var(--cyan); animation:rip .6s ease-out forwards; }
.fxp { position:fixed; z-index:147; pointer-events:none; font-weight:800; color:var(--lime); text-shadow:0 0 12px var(--lime); transform:translate(-50%,-50%); animation:rise 1.2s ease-out forwards; }
.toast { position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top,0px)); transform:translateX(-50%); z-index:250; max-width:90vw; text-align:center; font-weight:700; padding:10px 18px; border-radius:999px; background:var(--card); color:var(--cyan); border:1.5px solid var(--cyan); animation:drop 2.4s forwards; }
#lvlup { position:fixed; inset:0; z-index:140; display:grid; place-items:center; text-align:center; background:var(--lvbg); color:var(--lvfg,#fff); }
.lu h1 { font-size:2.4rem; margin:0; color:var(--sun); text-shadow:0 0 24px var(--sun); animation:boom .6s cubic-bezier(.2,1.6,.4,1); }
.lu b { font-size:1.3rem; color:var(--cyan); }
.ring { position:absolute; left:50%; top:50%; width:40px; height:40px; margin:-20px; border-radius:50%; border:3px solid var(--cyan); animation:ring 1.6s ease-out infinite; }
.ring.r2 { border-color:var(--pink); animation-delay:.5s; }
.levelwaves { position:absolute; left:50%; top:50%; width:20px; height:20px; transform:translate(-50%,-50%); pointer-events:none; }
.levelwaves span { position:absolute; inset:0; border:3px solid var(--cyan); border-radius:50%; animation:levelwave 2.2s ease-out infinite; }
.levelwaves span:nth-child(2) { border-color:var(--pink); animation-delay:.55s; }
.levelwaves span:nth-child(3) { border-color:var(--sun); animation-delay:1.1s; }
.levelwaves span:nth-child(4) { border-color:var(--lime); animation-delay:1.65s; }
@keyframes levelwave { 0% { transform:scale(.2); opacity:.95; } 70% { opacity:.35; } 100% { transform:scale(18); opacity:0; } }
#boot { position:fixed; inset:0; z-index:300; padding:30vh 20px 0; font-size:.8rem; transition:opacity .7s; background:var(--bootbg); color:var(--bootfg); font-family:var(--fh); }
#boot.off { opacity:0; } #boot p { margin:8px 0; animation:boom .3s; }
#reveal[hidden], #vault[hidden], #profile[hidden], #lvlup[hidden], #boot[hidden], #editor[hidden], #alert[hidden] { display:none; }
#profile, #editor, #vault { position:fixed; inset:0; overflow-y:auto; padding:calc(14px + env(safe-area-inset-top,0px)) 14px 40px; background:color-mix(in srgb,var(--bg) 95%,transparent); }
#profile { z-index:110; } #vault { z-index:100; } #editor { z-index:160; background:rgba(4,2,20,.8); }
.pbox, .ebox { max-width:560px; margin:0 auto; }
.ebox { margin-top:8vh; padding:16px; background:var(--card); color:var(--text); border:2px solid var(--cyan); border-radius:var(--r); clip-path:var(--clip); }
#vault > * { max-width:620px; margin-left:auto; margin-right:auto; }
.avgrid { display:grid; grid-template-columns:repeat(8,1fr); gap:6px; margin:10px 0; } .av { padding:6px 0; font-size:1.5rem; }
.skins { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0; }
.rank { display:flex; align-items:center; gap:10px; padding:10px; margin:6px 0; border:1px solid var(--line); border-radius:calc(var(--r) / 2); opacity:.55; }
.rank b { flex:1; } .rank.got { opacity:.9; border-color:var(--lime); }
.rank.cur { opacity:1; border:2px solid var(--cyan); animation:readyglow 2s infinite; }
.chart { width:100%; height:56px; display:block; margin:6px 0; }

// Normaliza un estado cargado (de localStorage, IndexedDB o respaldo)
function normalize(o) {
	const base = freshState(), s = Object.assign(base, o);
	// Compatibilidad con respaldos/guardados antiguos o incompletos.
	s.xp = Object.assign(base.xp, o.xp || {});
	s.pacts = Array.isArray(o.pacts) ? o.pacts : base.pacts;
	s.tasks = Array.isArray(o.tasks) ? o.tasks : [];
	s.taskDone = o.taskDone && typeof o.taskDone === "object" ? o.taskDone : {};
	s.hist = o.hist && typeof o.hist === "object" ? o.hist : {};
	s.active = o.active && typeof o.active === "object" ? o.active : {};
	s.money = Object.assign(base.money, o.money || {});
	s.money.list = Array.isArray(s.money.list) ? s.money.list : []; s.credits=Number.isFinite(o.credits)?o.credits:0; s.rewards=Array.isArray(o.rewards)?o.rewards:DEFAULT_REWARDS.map(x=>({...x})); s.purchases=Array.isArray(o.purchases)?o.purchases:[]; s.pacts.forEach(p=>{const def=DEFAULT_PACTS.find(d=>String(d.id)===String(p.id));p.maxDay=Math.max(1,+p.maxDay||(def&&def.maxDay)||1);p.credits=Math.max(1,+p.credits||(def&&def.credits)||10);p.criteria=p.criteria||(def&&def.criteria)||p.act;p.category=categoryForMission(p);});
	s.avatar = Object.assign(base.avatar, o.avatar || {});

	if (!Array.isArray(s.sc.pub.rituals)) s.sc.pub.rituals = base.sc.pub.rituals;
	if (!Array.isArray(s.sc.pub.sos)) s.sc.pub.sos = base.sc.pub.sos;
	if (!Array.isArray(s.sc.sec.rituals)) s.sc.sec.rituals = base.sc.sec.rituals;
	if (!Array.isArray(s.sc.sec.sos)) s.sc.sec.sos = base.sc.sec.sos;
	if (s.day !== today()) { s.day = today(); s.done = {}; s.crits = 0; } // día nuevo: se reinician las misiones
	s.pacts.forEach(p => { if (p.stat === "ORO") p.stat = "VOL"; if (p.stat2 === "ORO") p.stat2 = ""; });

	}).join("")}</svg>`;

	}
	if (a === "renr") return openEditor("✏️ Editar ritual", [{ k: "n", l: "Nombre", v: r.n }, { k: "g", l: "Gesto", v: r.g }], v => { r.n = v.n || r.n; r.g = v.g; });
	if (a === "renh") { const h = S.sos[i]; return openEditor("✏️ Editar hábito SOS", [{ k: "n", l: "Nombre", v: h.n }, { k: "r", l: "Mi razón", v: h.r }, { k: "a", l: "Acciones (separa con comas)", v: h.a.join(", ") }], v => { h.n = v.n || h.n; h.r = v.r; h.a = v.a.split(",").map(x => x.trim()).filter(Boolean); }); }
	if (a === "delr") S.rituals.splice(i, 1);
	if (a === "addr") { const v = $("nr-" + d.sc).value.trim(); if (v) S.rituals.push({ n: v, g: "Mi gesto", s: 0, pairs: 0, tries: 0, log: {} }); }
	if (a === "sel") S.sel = i;
	if (a === "addh") { const v = $("nh-" + d.sc).value.trim(); if (v) { S.sos.push({ n: v, r: "Quiero cambiar esto por mí", a: ["Respirar lento", "Tomar agua", "Moverme 5 minutos"], log: {} }); S.sel = S.sos.length - 1; } }
	if (a === "delh") { S.sos.splice(i, 1); S.sel = 0; }
	if (a === "sos") return startAlert(d.sc);
	save(); renderAll();
});
document.addEventListener("change", e => {
	const t = e.target, d = t.dataset; if (!d.p || !d.sc) return;
	const S = state.sc[d.sc], i = +d.i;
	if (d.p === "gest") S.rituals[i].g = t.value;
	if (d.p === "reason") S.sos[i].r = t.value;
	if (d.p === "acts") S.sos[i].a = t.value.split(",").map(x => x.trim()).filter(Boolean);
	save();
});
let alertT = null;
function startAlert(sc) {
	const S = state.sc[sc], h = S.sos[S.sel]; if (!h) return toast("Crea primero un hábito");
	const end = Date.now() + CONFIG.SOS_SECONDS * 1000, A = $("alert"), T = CONFIG.SOS_SECONDS, acts = h.a.length ? h.a : ["Respira lento"];
	A.hidden = false;
	A.innerHTML = `<div class="abox"><div class="siren">🚨</div><h1>ALERTA ROJA</h1><b>${esc(h.n)}</b>
		<div class="acount" id="acount">${fmt(T)}</div><div class="bar"><i id="abar"></i></div><div class="pulse"></div>
		<p class="aact" id="aact"></p><p>💜 ${esc(h.r)}</p><button id="aquit">Salir sin culpa</button></div>`;
	play([880, 660, 880, 660, 880], .18, "square"); if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
	$("aquit").onclick = () => { clearInterval(alertT); A.hidden = true; addXP("VOL", 5); save(); toast("Intentarlo también cuenta +5 XP"); renderAll(); };
	clearInterval(alertT);
	alertT = setInterval(() => {
		const left = Math.max(0, Math.ceil((end - Date.now()) / 1000)), el = T - left;
		$("acount").textContent = fmt(left); $("abar").style.width = (el / T * 100) + "%";
		$("aact").textContent = "👉 " + acts[Math.min(acts.length - 1, Math.floor(el / T * acts.length))];
		if (left <= 0) { clearInterval(alertT); finishAlert(h); }
	}, 500);
}
function finishAlert(h) {
	h.log[today()] = (h.log[today()] || 0) + 1; addXP("VOL", 40); save();
	play([523, 659, 784, 1047, 1319], .14); confetti(); setTimeout(confetti, 300); if (navigator.vibrate) navigator.vibrate([80, 40, 80, 40, 200]);
	$("alert").innerHTML = `<div class="abox ok"><div class="siren">🏆</div><h1>¡BIEN HECHO!</h1><p>Surfeaste el impulso de ${esc(h.n)} durante 10 minutos.</p><p><b>+40 XP 💜</b></p><button class="big" id="aok">Seguir</button></div>`;
	$("aok").onclick = () => { $("alert").hidden = true; renderAll(); };
}

// ============ Zona privada (5 toques al avatar + PIN local) ============
let secOpen = false;
const V = $("vault");
let taps = 0, tapT;
document.querySelector(".avatar").onclick = () => {
	taps++; clearTimeout(tapT); tapT = setTimeout(() => taps = 0, 2000);
	if (taps >= 5) { taps = 0; V.hidden = false; lock(); }
};
function closeVault() { V.hidden = true; V.innerHTML = ""; secOpen = false; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeVault(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) closeVault(); });
function lock(msg = "") {
	const first = !state.pin;
	V.innerHTML = `<section class="tile"><h2>🔐 Acceso</h2><p>${first ? "Crea un PIN (4+ dígitos)" : "Ingresa tu PIN"}</p>
		<input type="password" id="pin" inputmode="numeric" maxlength="8"><p style="color:var(--pink)">${msg}</p>
		<div class="btns"><button id="pOk" class="big" style="animation:none">${first ? "Crear" : "Entrar"}</button><button id="pX">Salir</button></div></section>`;
	$("pX").onclick = closeVault;
	$("pOk").onclick = () => {
		const p = $("pin").value; if (p.length < 4) return lock("Mínimo 4 dígitos");
		if (first) { state.pin = hash(p); save(); unlocked(); } else if (hash(p) === state.pin) unlocked(); else lock("PIN incorrecto");
	};
}
function unlocked() {
	secOpen = true;
	V.innerHTML = `<section class="tile sechead" style="margin-bottom:12px"><h2 style="margin:0">🔒 Zona privada</h2><button id="sx">Cerrar</button></section>
		<div id="secBody">${panel("sec")}</div><p><button id="sw">Borrar zona privada</button></p>`;
	$("sx").onclick = closeVault;
	$("sw").onclick = e => {
		if (e.target.dataset.s) { state.sc.sec = freshState().sc.sec; state.pin = null; save(); closeVault(); }
		else { e.target.dataset.s = 1; e.target.textContent = "¿Seguro? Toca otra vez"; }
	};
}

// ============ Perfil y respaldo ============
const AVATARS = ["🧑‍🚀", "👽", "🤖", "🦾", "🛸", "👾", "🧙", "🥷", "🐱", "🦊", "🐺", "🦉", "🐉", "🌌", "🪐", "☄️"];
function renderAvatar() { const a = state.avatar || { e: "🧑‍🚀", img: null }; document.querySelector(".avatar").innerHTML = a.img ? `<img src="${a.img}" alt="">` : a.e; }
function openProfile() {
	const l = levelOf(total()), cur = RANKS.filter(r => l >= r[0]).length - 1, P = $("profile");
	P.hidden = false;
	P.innerHTML = `<div class="pbox"><div class="sechead"><h2 style="margin:0">👤 Perfil</h2><button id="pclose">✖ Cerrar</button></div>
		<h2 style="margin-top:14px">🎨 Tema</h2>
		<div class="skins">${Object.keys(SKINS).map(k => `<button data-skin="${k}" class="${state.skin === k ? "on" : ""}">${SKINS[k].n}</button>`).join("")}</div>
		<h2 style="margin-top:14px">Avatar</h2>
		<div class="avgrid">${AVATARS.map(a => `<button class="av" data-av="${a}">${a}</button>`).join("")}</div>
		<div class="btns"><button id="pphoto">📷 Subir foto</button><button id="prm">Quitar foto</button></div><input type="file" id="pfile" accept="image/*" hidden>
		<h2 style="margin-top:16px">💾 Respaldo</h2><button id="pbackup" style="width:100%">💾 Copiar / restaurar mis datos</button>
		<h2 style="margin-top:16px">🏅 Rangos (tu nivel: ${l} · ${total()} XP)</h2>
		${RANKS.map((r, i) => `<div class="rank ${i === cur ? "cur" : i < cur ? "got" : ""}"><span>${i <= cur ? "🏅" : "🔒"}</span><b>${r[1]}</b><small>Nv ${r[0]} · ${startOf(r[0])} XP</small></div>`).join("")}</div>`;
}
document.querySelector(".nm").onclick = openProfile;
$("profile").addEventListener("click", e => {
	const b = e.target.closest("button"); if (!b) return; const id = b.id;
	if (b.dataset.skin) { applySkin(b.dataset.skin); save(); renderAll(); kick(); fireworks(); return openProfile(); }
	if (b.dataset.av) { state.avatar = { e: b.dataset.av, img: null }; save(); renderAvatar(); return openProfile(); }
	if (id === "pclose") $("profile").hidden = true;
	if (id === "pphoto") $("pfile").click();
	if (id === "pbackup") return openBackup();
	if (id === "prm") { state.avatar.img = null; save(); renderAvatar(); openProfile(); }
});
$("profile").addEventListener("change", e => { // la foto se recorta al centro y se reduce a 160 px
	if (e.target.id !== "pfile" || !e.target.files[0]) return;
	const rd = new FileReader();
	rd.onload = () => { const im = new Image(); im.onload = () => {
		const c = document.createElement("canvas"), n = 160, m = Math.min(im.width, im.height); c.width = c.height = n;
		c.getContext("2d").drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, n, n);
		state.avatar = { e: "🧑‍🚀", img: c.toDataURL("image/jpeg", .8) }; save(); renderAvatar(); openProfile(); }; im.src = rd.result; };
	rd.readAsDataURL(e.target.files[0]);
});
// Respaldo como texto: copiar o pegar (funciona aunque las descargas estén bloqueadas)
function openBackup() {
	const E = $("editor"); E.hidden = false;
	E.innerHTML = `<div class="ebox"><div class="sechead"><h2 style="margin:0">💾 Respaldo</h2><button id="ecancel">✖</button></div>
		<p><small>Copia este texto y guárdalo. Para restaurar, pega un respaldo y toca Restaurar.</small></p>
		<textarea id="bk" rows="8" style="width:100%;font-size:.75rem"></textarea>
		<div class="btns" style="margin-top:8px"><button id="bkcopy">📋 Copiar</button><button id="bkrestore">♻️ Restaurar</button></div></div>`;
	$("bk").value = JSON.stringify(state);
	$("ecancel").onclick = () => { E.hidden = true; };
	$("bkcopy").onclick = () => {
		$("bk").select();
		(navigator.clipboard ? navigator.clipboard.writeText($("bk").value) : Promise.reject()).catch(() => document.execCommand("copy"));
		toast("📋 Copiado");
	};
	$("bkrestore").onclick = () => {
		try {
			const o = JSON.parse($("bk").value); if (!o || !o.xp || !o.pacts) throw 0;
			state = normalize(o); state.t = Date.now(); applySkin(state.skin); save(); renderAll(); E.hidden = true; $("profile").hidden = true; toast("♻️ Datos restaurados");
		} catch (e) { toast("Respaldo no válido"); }
	};
}

// ============ Arranque ============
function boot() {
	const B = $("boot"), L = ["◆ " + CONFIG.APP_NAME.toUpperCase() + " ◆", ...SKINS[state.skin].boot]; let i = 0;
	const iv = setInterval(() => {
		if (i < L.length) B.innerHTML += `<p>${L[i++]}</p>`;
		else { clearInterval(iv); setTimeout(() => B.classList.add("off"), 350); setTimeout(() => { B.hidden = true; }, 1050); kick(); }
	}, 380);
	B.onclick = () => { clearInterval(iv); B.hidden = true; kick(); };
}
function renderAll() { renderHead(); renderPacts(); renderShop(); renderList(); renderStats(); renderTasks(); renderGold(); $("calma").innerHTML = panel("pub"); if (secOpen) $("secBody").innerHTML = panel("sec"); }
// Si la app queda abierta pasada la medianoche, reinicia las misiones del día
function checkNewDay() {
	if (state.day === today()) return;
	state.day = today(); state.done = {}; state.crits = 0; save(); renderAll();
}
setInterval(checkNewDay, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkNewDay(); });

document.title = CONFIG.APP_NAME; applySkin(state.skin); renderAll(); boot(); initStorage(); tickCount(); setInterval(tickCount, 1000);
</script>
</body>
</html>
